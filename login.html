<html>
    <head>
        <title>welcome to ACE e-book's website</title>
        <script>
            FunctionValidateLoginform() {
                var username=document.forms["f1"]["username"].value;
                var password=document.forms["f1"]["password"].value;
                if(username.trim()==""){
                    alert("username cannot be empty");//shows an alert if empty
                    return false;//prevents from submission
                }
                if(password.length<6){
                    alert("password must be atleast 6 characters long");
                    return false;
                }
                return true;
            }
        </script>
    </head>
    <body bgcolor="lightblue">
        <center>
            <br/>
            <h3>logindetails</h3>

                    </tr>

                    </tr>

                    </tr>

        </center>
